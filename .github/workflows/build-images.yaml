# Purpose: Build every image from its lock on both architectures and test it; after a merge to main,
#          publish the images that changed.
# Role: Repository-owned check and publisher. On a pull request, or a manual run on another branch,
#       it builds and tests with a read-only token. On main it does the same and then publishes, with
#       the only write access. The steps live in the reusable workflow build-test-publish.yaml.
name: Build images
on:
  pull_request:
    paths:
      - build/**
      - images/**
      - .github/workflows/build-images.yaml
      - .github/workflows/build-test-publish.yaml
  push:
    branches: [main]
    paths:
      - build/**
      - images/**
      - .github/workflows/build-images.yaml
      - .github/workflows/build-test-publish.yaml
  workflow_dispatch:
permissions: {}
jobs:
  check:
    if: github.ref != 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/build-test-publish.yaml
    with:
      publish: false
  # One publish at a time: a second merge waits instead of racing the first on the latest tag.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-test-publish.yaml
    with:
      publish: true
