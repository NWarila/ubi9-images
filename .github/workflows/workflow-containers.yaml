# Purpose: Check that the files this repository copies from its organization template still match
#          the pinned template, on every pull request and on every push to main.
# Role: Organization staple workflow, a thin caller: each job calls one organization workflow
#       container. template-drift reads the template to follow from
#       .github/.config/template-drift.yaml and the template commit to compare with from
#       .github/.config/template-drift.lock.
name: Workflow containers
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  template-drift:
    permissions:
      contents: read
      pull-requests: write # The check posts its result as a comment on the pull request.
    uses: nwarila-platform/workflow-template-drift/.github/workflows/check.yaml@3ac6d2f3ce65e2f98963826e71ad9e79c5e43c09 # v3.0.0
